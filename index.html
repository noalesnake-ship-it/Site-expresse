<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Express – Ton site web à 15€</title>
<!--
=====================================================================
 SITE EXPRESS – vente de sites web (compte pseudo + mot de passe)
=====================================================================
 TOUT SE MODIFIE DANS LE BLOC "CONFIG" plus bas (textes, prix, liens).
 Les prix/promo se changent aussi depuis le panneau Admin du site.

 MODE DÉMO : sans Firebase, tout est stocké dans le navigateur (test
 uniquement : les commandes ne te parviennent PAS).

 MODE RÉEL (Firebase, gratuit) :
 1. console.firebase.google.com → créer un projet → ajouter une app Web
    → copier l'objet firebaseConfig dans CONFIG.FIREBASE.
 2. Authentication → Sign-in method → activer "E-mail/Mot de passe".
 3. Firestore Database → créer la base → onglet Règles → coller :

    rules_version = '2';
    service cloud.firestore { match /databases/{db}/documents {
      function admin(){ return request.auth != null &&
        request.auth.token.email == 'TONPSEUDOADMIN@ecaps-sites.app'; }
      match /settings/{d} { allow read: if true; allow write: if admin(); }
      match /orders/{id} {
        allow create: if request.auth != null
          && request.resource.data.uid == request.auth.uid
          && request.resource.data.status == 'attente';
        allow read: if request.auth != null
          && (resource.data.uid == request.auth.uid || admin());
        allow update, delete: if admin();
      }
    } }

    (remplace TONPSEUDOADMIN par ton pseudo admin en minuscules, et le
     domaine par CONFIG.AUTH_DOMAIN si tu le changes)
 4. Authentication → Settings → Domaines autorisés : ajouter
    tonpseudo.github.io
 5. CRÉE TON COMPTE ADMIN EN PREMIER (même pseudo que dans ADMIN_PSEUDOS),
    sinon quelqu'un d'autre pourrait prendre ce pseudo.

 PAIEMENT : crée un "Payment Link" Stripe (ou un lien PayPal.me) au prix
 du moment et colle-le dans CONFIG.PAYMENT_URL. Le site ne peut pas
 vérifier le paiement tout seul : tu vois l'argent dans Stripe/PayPal et
 tu passes la commande en "Payée" depuis l'Admin.
=====================================================================
-->
<style>
:root{--bg:#0c0c12;--card:#161620;--line:#2a2a3a;--txt:#f2f2f7;--mut:#9a9ab0;--gold:#ffc83d;--red:#ff4d5e;--green:#3ddc84;--r:16px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh}
a{color:var(--gold)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,12,18,.92);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.2rem;color:var(--txt);text-decoration:none}
.logo span{color:var(--gold)}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--gold);color:#111;text-decoration:none;font-family:inherit}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.hero{text-align:center;padding:30px 0 10px}
.badge{display:inline-block;background:var(--red);color:#fff;font-weight:800;border-radius:99px;padding:6px 14px;font-size:.85rem;letter-spacing:.4px}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.15;margin:16px 0 10px}
h2{font-size:1.4rem;margin:34px 0 14px}
.sub{color:var(--mut);max-width:560px;margin:0 auto 20px}
.price{display:flex;align-items:baseline;justify-content:center;gap:14px;margin:14px 0}
.price .old{font-size:1.6rem;color:var(--mut);text-decoration:line-through}
.price .new{font-size:3.4rem;font-weight:900;color:var(--gold)}
.cd{display:flex;gap:8px;justify-content:center;margin:10px 0 22px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:62px}
.cd b{display:block;font-size:1.4rem}
.cd small{color:var(--mut);font-size:.7rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#111;font-weight:800;margin-bottom:8px}
ul.ok{list-style:none;padding:0;display:grid;gap:8px}
ul.ok li::before{content:"✓ ";color:var(--green);font-weight:800}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
label small{color:var(--mut);font-weight:400}
input,select,textarea{background:#0f0f17;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-size:1rem;font-family:inherit;width:100%}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
.box{max-width:430px;margin:20px auto}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1}
.msg{padding:12px 14px;border-radius:12px;margin:12px 0;font-size:.95rem}
.msg.err{background:#3a1520;border:1px solid var(--red)}
.msg.ok{background:#12301f;border:1px solid var(--green)}
.msg.info{background:#2a2410;border:1px solid var(--gold)}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.st.attente{background:#3a2e10;color:var(--gold)}.st.paye{background:#12301f;color:var(--green)}
.st.encours{background:#12263a;color:#5ab4ff}.st.livre{background:#1f3a12;color:#9dff5a}.st.annule{background:#3a1520;color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ord{margin-bottom:12px}
.ord p{color:var(--mut);white-space:pre-wrap;font-size:.92rem;margin-top:6px}
details summary{cursor:pointer;font-weight:700}
.demo{background:#2a2410;color:var(--gold);text-align:center;font-size:.82rem;padding:6px}
footer{text-align:center;color:var(--mut);font-size:.82rem;padding:30px 10px}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.two{grid-template-columns:1fr}.price .new{font-size:2.8rem}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Mode démo : les données restent dans ce navigateur. Configure Firebase pour de vrai.</div>
<header>
  <a class="logo" href="#/" id="logo"></a>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<script type="module">
/* ============================ CONFIG – MODIFIE ICI ============================ */
const CONFIG = {
  BRAND: "Site Express",
  TAGLINE: "Décris ton site, paie, et je te l'envoie.",
  FOOTER: "© " + new Date().getFullYear() + " Site Express – Tous droits réservés",

  // Pseudo(s) admin (minuscules). Crée ce compte EN PREMIER.
  ADMIN_PSEUDOS: ["admin"],

  // Les pseudos sont transformés en pseudo@AUTH_DOMAIN pour Firebase (invisible pour les clients)
  AUTH_DOMAIN: "ecaps-sites.app",

  // Lien de paiement Stripe (Payment Link) ou PayPal.me. Vide = bouton désactivé.
  PAYMENT_URL: "",

  // Optionnel : reçois un e-mail à chaque commande (via formsubmit.co, il faut confirmer ton adresse
  // une première fois dans l'e-mail qu'ils t'envoient)
  NOTIFY_EMAIL: "",

  // Colle ici l'objet firebaseConfig (ou laisse null = mode démo)
  FIREBASE: null,
  /* exemple :
  FIREBASE: { apiKey:"...", authDomain:"xxx.firebaseapp.com", projectId:"xxx", appId:"..." }, */

  // Prix par défaut (modifiables ensuite dans Admin)
  DEFAULTS: { price: 30, promoPrice: 15, promoLabel: "Black Friday → Noël : -50%", promoEnd: "2026-12-25T23:59:59" },

  INCLUDED: [
    "Site web sur-mesure d'après ta description",
    "Adapté au téléphone (responsive)",
    "Livré en fichiers prêts à mettre en ligne",
    "1 retouche gratuite après livraison",
    "Support par message"
  ],
  TYPES: ["Site vitrine", "Portfolio", "Boutique simple", "Blog", "Page de présentation", "Autre"]
};
/* =============================================================================== */

const STATUS = { attente:"En attente de paiement", paye:"Payée", encours:"En cours de création", livre:"Livrée", annule:"Annulée" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
const pseudoOk = p => /^[A-Za-z0-9_-]{3,20}$/.test(p);
const emailOf = p => p.toLowerCase() + "@" + CONFIG.AUTH_DOMAIN;
const isAdmin = u => !!u && CONFIG.ADMIN_PSEUDOS.map(x => x.toLowerCase()).includes(u.pseudo.toLowerCase());
const promoOn = s => s.promoPrice !== null && s.promoPrice !== "" && !isNaN(+s.promoPrice) && new Date(s.promoEnd) > new Date();
const cur = s => promoOn(s) ? +s.promoPrice : +s.price;
const fmtDate = t => new Date(t).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });

/* ------------------------------ Backend : démo (localStorage) ------------------------------ */
const LS = {
  get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};
async function sha(s) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch { return btoa(unescape(encodeURIComponent(s))); }
}
const localBackend = {
  demo: true,
  async user() { return LS.get("se_session", null); },
  async signUp(p, pw) {
    const users = LS.get("se_users", {}); const k = p.toLowerCase();
    if (users[k]) throw new Error("Ce pseudo existe déjà.");
    users[k] = await sha(pw); LS.set("se_users", users); LS.set("se_session", { pseudo: p, uid: k });
  },
  async signIn(p, pw) {
    const users = LS.get("se_users", {}); const k = p.toLowerCase();
    if (!users[k] || users[k] !== await sha(pw)) throw new Error("Pseudo ou mot de passe incorrect.");
    LS.set("se_session", { pseudo: p, uid: k });
  },
  async signOut() { localStorage.removeItem("se_session"); },
  async createOrder(o) { const all = LS.get("se_orders", []); o.id = "o" + Date.now(); all.push(o); LS.set("se_orders", all); return o.id; },
  async myOrders(u) { return LS.get("se_orders", []).filter(o => o.uid === u.uid); },
  async allOrders() { return LS.get("se_orders", []); },
  async updateOrder(id, patch) { LS.set("se_orders", LS.get("se_orders", []).map(o => o.id === id ? { ...o, ...patch } : o)); },
  async getSettings() { return { ...CONFIG.DEFAULTS, ...LS.get("se_settings", {}) }; },
  async saveSettings(s) { LS.set("se_settings", s); }
};

/* ------------------------------ Backend : Firebase ------------------------------ */
async function firebaseBackend() {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
  ]);
  const fa = initializeApp(CONFIG.FIREBASE), auth = A.getAuth(fa), db = F.getFirestore(fa);
  const ready = new Promise(res => { const un = A.onAuthStateChanged(auth, () => { un(); res(); }); });
  const fix = e => {
    const m = { "auth/email-already-in-use": "Ce pseudo existe déjà.", "auth/invalid-credential": "Pseudo ou mot de passe incorrect.",
      "auth/wrong-password": "Pseudo ou mot de passe incorrect.", "auth/user-not-found": "Pseudo ou mot de passe incorrect.",
      "auth/weak-password": "Mot de passe trop court (6 caractères minimum).", "auth/too-many-requests": "Trop d'essais, réessaie plus tard." };
    return new Error(m[e.code] || e.message);
  };
  return {
    demo: false,
    async user() { await ready; const u = auth.currentUser; return u ? { uid: u.uid, pseudo: u.displayName || u.email.split("@")[0] } : null; },
    async signUp(p, pw) { try { const c = await A.createUserWithEmailAndPassword(auth, emailOf(p), pw); await A.updateProfile(c.user, { displayName: p }); } catch (e) { throw fix(e); } },
    async signIn(p, pw) { try { await A.signInWithEmailAndPassword(auth, emailOf(p), pw); } catch (e) { throw fix(e); } },
    async signOut() { await A.signOut(auth); },
    async createOrder(o) { const r = await F.addDoc(F.collection(db, "orders"), o); return r.id; },
    async myOrders(u) {
      const s = await F.getDocs(F.query(F.collection(db, "orders"), F.where("uid", "==", u.uid)));
      return s.docs.map(d => ({ ...d.data(), id: d.id }));
    },
    async allOrders() { const s = await F.getDocs(F.collection(db, "orders")); return s.docs.map(d => ({ ...d.data(), id: d.id })); },
    async updateOrder(id, patch) { await F.updateDoc(F.doc(db, "orders", id), patch); },
    async getSettings() {
      try { const d = await F.getDoc(F.doc(db, "settings", "main")); return { ...CONFIG.DEFAULTS, ...(d.exists() ? d.data() : {}) }; }
      catch { return { ...CONFIG.DEFAULTS }; }
    },
    async saveSettings(s) { await F.setDoc(F.doc(db, "settings", "main"), s); }
  };
}

let B;
try { B = CONFIG.FIREBASE ? await firebaseBackend() : localBackend; }
catch (e) { console.error(e); B = localBackend; setTimeout(() => alert("Firebase n'a pas pu démarrer, mode démo activé."), 300); }
if (B.demo) $("#demo").hidden = false;

/* ------------------------------ Navigation ------------------------------ */
function renderNav(u) {
  $("#logo").innerHTML = esc(CONFIG.BRAND).replace(/(\S+)$/, "<span>$1</span>");
  $("#foot").textContent = CONFIG.FOOTER;
  $("#nav").innerHTML = u
    ? `<a class="btn ghost sm" href="#/orders">Mes commandes</a>${isAdmin(u) ? '<a class="btn ghost sm" href="#/admin">Admin</a>' : ""}
       <a class="btn sm" href="#/order">Commander</a><button class="btn ghost sm" id="out">Déconnexion (${esc(u.pseudo)})</button>`
    : `<a class="btn ghost sm" href="#/login">Connexion</a><a class="btn sm" href="#/login?m=up">Inscription</a>`;
  const o = $("#out"); if (o) o.onclick = async () => { await B.signOut(); location.hash = "#/"; route(); };
}

let timer;
function priceBlock(s) {
  return promoOn(s)
    ? `<div class="price"><span class="old">${+s.price}€</span><span class="new">${+s.promoPrice}€</span></div>`
    : `<div class="price"><span class="new">${+s.price}€</span></div>`;
}
function startCountdown(s) {
  clearInterval(timer);
  const el = $("#cd"); if (!el || !promoOn(s)) return;
  const tick = () => {
    let d = Math.max(0, new Date(s.promoEnd) - new Date()); if (!d) return route();
    const j = Math.floor(d / 864e5), h = Math.floor(d % 864e5 / 36e5), m = Math.floor(d % 36e5 / 6e4), sec = Math.floor(d % 6e4 / 1e3);
    el.innerHTML = [[j, "jours"], [h, "heures"], [m, "min"], [sec, "sec"]].map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join("");
  };
  tick(); timer = setInterval(tick, 1000);
}

/* ------------------------------ Pages ------------------------------ */
function home({ user, s }) {
  app.innerHTML = `
  <section class="hero">
    ${promoOn(s) ? `<span class="badge">🎄 ${esc(s.promoLabel)}</span>` : ""}
    <h1>Ton site web, livré clé en main</h1>
    <p class="sub">${esc(CONFIG.TAGLINE)}</p>
    ${priceBlock(s)}
    ${promoOn(s) ? `<p class="sub" style="margin-bottom:6px">L'offre se termine dans :</p><div class="cd" id="cd"></div>` : ""}
    <a class="btn" href="${user ? "#/order" : "#/login?m=up&next=order"}">Commander mon site</a>
  </section>
  <h2>Comment ça marche</h2>
  <div class="grid">
    <div class="card"><span class="n">1</span><br><b>Crée ton compte</b><br><small style="color:var(--mut)">Un pseudo et un mot de passe, c'est tout.</small></div>
    <div class="card"><span class="n">2</span><br><b>Décris ton site</b><br><small style="color:var(--mut)">Plus tu détailles, plus le résultat te ressemble.</small></div>
    <div class="card"><span class="n">3</span><br><b>Paie en ligne</b><br><small style="color:var(--mut)">Paiement sécurisé.</small></div>
    <div class="card"><span class="n">4</span><br><b>Reçois ton site</b><br><small style="color:var(--mut)">Je te l'envoie dès qu'il est prêt.</small></div>
  </div>
  <h2>Ce qui est inclus</h2>
  <div class="card"><ul class="ok">${CONFIG.INCLUDED.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  startCountdown(s);
}

function login({ user, qs }) {
  if (user) { location.hash = "#/order"; return; }
  let up = qs.get("m") === "up";
  const draw = (err = "") => {
    app.innerHTML = `<div class="box card">
      <div class="tabs"><button class="btn ${up ? "ghost" : ""}" id="t-in">Connexion</button><button class="btn ${up ? "" : "ghost"}" id="t-up">Inscription</button></div>
      <form id="f">
        <label>Pseudo <small>3 à 20 caractères : lettres, chiffres, - ou _</small><input name="p" autocomplete="username" required maxlength="20"></label>
        <label>Mot de passe <small>6 caractères minimum</small><input name="pw" type="password" autocomplete="${up ? "new-password" : "current-password"}" required minlength="6"></label>
        ${up ? `<label>Confirme le mot de passe<input name="pw2" type="password" autocomplete="new-password" required minlength="6"></label>` : ""}
        ${err ? `<div class="msg err">${esc(err)}</div>` : ""}
        <button class="btn" id="go">${up ? "Créer mon compte" : "Me connecter"}</button>
      </form></div>`;
    $("#t-in").onclick = () => { up = false; draw(); };
    $("#t-up").onclick = () => { up = true; draw(); };
    $("#f").onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target), p = f.get("p").trim(), pw = f.get("pw");
      if (!pseudoOk(p)) return draw("Pseudo invalide (3-20 caractères : lettres, chiffres, - ou _).");
      if (up && pw !== f.get("pw2")) return draw("Les mots de passe ne correspondent pas.");
      $("#go").disabled = true;
      try { up ? await B.signUp(p, pw) : await B.signIn(p, pw); location.hash = "#/" + (qs.get("next") || "order"); route(); }
      catch (er) { draw(er.message); }
    };
  };
  draw();
}

function order({ user, s }) {
  if (!user) { location.hash = "#/login?m=up&next=order"; return; }
  app.innerHTML = `<h1 style="font-size:1.8rem">Commande ton site</h1>
  <p class="sub" style="margin:8px 0 18px;text-align:left">Plus ta description est précise, plus le site te ressemblera.</p>
  <div class="card"><form id="f">
    <label>Nom du site / du projet<input name="title" required maxlength="80" placeholder="Ex : Boulangerie Martin"></label>
    <label>Type de site<select name="type">${CONFIG.TYPES.map(t => `<option>${esc(t)}</option>`).join("")}</select></label>
    <label>Description détaillée <small>Activité, public visé, ce que le site doit faire, textes, ambiance…</small>
      <textarea name="desc" required minlength="30" maxlength="4000" placeholder="Décris ton site en détail…"></textarea></label>
    <label>Pages souhaitées <small>Ex : Accueil, Tarifs, Contact</small><input name="pages" maxlength="200"></label>
    <label>Couleurs / style <small>Ex : sombre et moderne, vert pastel, comme tel site…</small><input name="style" maxlength="200"></label>
    <label>Comment je te l'envoie ? <small>E-mail ou téléphone/WhatsApp</small><input name="contact" required maxlength="120"></label>
    <div class="msg info row"><span>Total à payer</span><b style="font-size:1.4rem">${cur(s)}€</b></div>
    <div id="err"></div>
    <button class="btn" id="go">Valider ma commande</button>
  </form></div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); $("#go").disabled = true;
    const o = { uid: user.uid, pseudo: user.pseudo, title: f.title.trim(), type: f.type, desc: f.desc.trim(), pages: f.pages.trim(),
      style: f.style.trim(), contact: f.contact.trim(), price: cur(s), status: "attente", createdAt: Date.now() };
    try {
      const id = await B.createOrder(o); notify(o);
      location.hash = "#/orders?new=" + encodeURIComponent(id); route();
    } catch (er) { $("#err").innerHTML = `<div class="msg err">Erreur : ${esc(er.message)}</div>`; $("#go").disabled = false; }
  };
}

function notify(o) {
  if (!CONFIG.NOTIFY_EMAIL) return;
  fetch("https://formsubmit.co/ajax/" + encodeURIComponent(CONFIG.NOTIFY_EMAIL), {
    method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ _subject: "Nouvelle commande : " + o.title, client: o.pseudo, type: o.type, prix: o.price + "€",
      contact: o.contact, pages: o.pages, style: o.style, description: o.desc })
  }).catch(() => {});
}

function payUrl(o) {
  if (!CONFIG.PAYMENT_URL) return "";
  const u = new URL(CONFIG.PAYMENT_URL); u.searchParams.set("client_reference_id", o.id); return u.toString();
}

async function orders({ user, qs }) {
  if (!user) { location.hash = "#/login"; return; }
  app.innerHTML = "<p class='sub'>Chargement…</p>";
  const list = (await B.myOrders(user)).sort((a, b) => b.createdAt - a.createdAt);
  const banner = qs.get("paid") ? `<div class="msg ok">Merci ! Ton paiement est en cours de vérification, tu recevras ton site très vite.</div>`
    : qs.get("new") ? `<div class="msg ok">Commande enregistrée ✅ Il ne reste plus qu'à payer pour lancer la création.</div>` : "";
  app.innerHTML = `<h1 style="font-size:1.8rem;margin-bottom:14px">Mes commandes</h1>${banner}` +
    (list.length ? list.map(o => `<div class="card ord"><div class="row"><b>${esc(o.title)}</b><span class="st ${esc(o.status)}">${esc(STATUS[o.status] || o.status)}</span></div>
      <div class="row" style="margin-top:6px"><small style="color:var(--mut)">${fmtDate(o.createdAt)} · ${esc(o.type)}</small><b>${+o.price}€</b></div>
      <p>${esc(o.desc)}</p>
      ${o.status === "attente" ? (CONFIG.PAYMENT_URL ? `<a class="btn" style="margin-top:12px" href="${esc(payUrl(o))}">Payer ${+o.price}€</a>`
        : `<div class="msg info">Le paiement en ligne n'est pas encore activé. Contacte-moi pour finaliser.</div>`) : ""}</div>`).join("")
      : `<div class="card">Tu n'as pas encore de commande. <a href="#/order">Commander mon site</a></div>`);
}

async function admin({ user, s }) {
  if (!isAdmin(user)) { location.hash = "#/"; return; }
  app.innerHTML = "<p class='sub'>Chargement…</p>";
  let list = []; let err = "";
  try { list = (await B.allOrders()).sort((a, b) => b.createdAt - a.createdAt); } catch (e) { err = e.message; }
  const dt = d => { const x = new Date(d); return isNaN(x) ? "" : new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
  app.innerHTML = `<h1 style="font-size:1.8rem;margin-bottom:14px">Admin</h1>
  <div class="card"><b>Prix & promotion</b>
    <form id="fs" style="margin-top:12px">
      <div class="two"><label>Prix normal (€)<input name="price" type="number" min="0" step="0.01" value="${+s.price}"></label>
      <label>Prix promo (€) <small>vide = pas de promo</small><input name="promoPrice" type="number" min="0" step="0.01" value="${s.promoPrice ?? ""}"></label></div>
      <div class="two"><label>Texte du badge<input name="promoLabel" value="${esc(s.promoLabel)}"></label>
      <label>Fin de la promo<input name="promoEnd" type="datetime-local" value="${dt(s.promoEnd)}"></label></div>
      <button class="btn">Enregistrer</button><div id="sm"></div>
    </form></div>
  <h2>Commandes (${list.length})</h2>${err ? `<div class="msg err">${esc(err)}</div>` : ""}
  ${list.map(o => `<div class="card ord"><div class="row"><b>${esc(o.title)}</b>
      <select data-id="${esc(o.id)}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></div>
    <small style="color:var(--mut)">${fmtDate(o.createdAt)} · client : <b>${esc(o.pseudo)}</b> · ${+o.price}€ · ${esc(o.type)}</small>
    <details style="margin-top:8px"><summary>Voir le détail</summary>
      <p><b>Contact :</b> ${esc(o.contact)}\n<b>Pages :</b> ${esc(o.pages || "–")}\n<b>Style :</b> ${esc(o.style || "–")}\n\n${esc(o.desc)}</p></details></div>`).join("") || "<div class='card'>Aucune commande pour l'instant.</div>"}`;
  $("#fs").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const n = { price: +f.get("price"), promoPrice: f.get("promoPrice") === "" ? null : +f.get("promoPrice"),
      promoLabel: f.get("promoLabel"), promoEnd: f.get("promoEnd") ? new Date(f.get("promoEnd")).toISOString() : "" };
    try { await B.saveSettings(n); $("#sm").innerHTML = `<div class="msg ok">Enregistré ✅</div>`; }
    catch (er) { $("#sm").innerHTML = `<div class="msg err">${esc(er.message)}</div>`; }
  };
  app.querySelectorAll("select[data-id]").forEach(sel => sel.onchange = async () => {
    try { await B.updateOrder(sel.dataset.id, { status: sel.value }); } catch (er) { alert(er.message); }
  });
}

/* ------------------------------ Routeur ------------------------------ */
async function route() {
  clearInterval(timer);
  const [path, q] = location.hash.slice(1).split("?");
  const [user, s] = await Promise.all([B.user(), B.getSettings()]);
  renderNav(user);
  const pages = { "/": home, "/login": login, "/order": order, "/orders": orders, "/admin": admin };
  await (pages[path || "/"] || home)({ user, s, qs: new URLSearchParams(q || "") });
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
// retour de paiement Stripe : configure l'URL de succès sur  https://tonsite/?paid=1
if (new URLSearchParams(location.search).get("paid")) location.hash = "#/orders?paid=1";
route();
</script>
</body>
